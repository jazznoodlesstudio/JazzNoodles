<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="接力隊：選手、棒子、裁判。選手各跑一段，棒子是產物檔案，裁判不下場">
<title>接力隊：選手、棒子、裁判</title>
<rect width="960" height="560" rx="20" fill="#F8FAFF" stroke="#6FB6FF" stroke-width="2"/>
<rect x="40" y="40" width="10" height="34" rx="3" fill="#FFD166"/>
<text x="64" y="68" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="800" fill="#14284B" text-anchor="start">接力隊：選手、棒子、裁判</text>
<text x="40" y="106" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="400" fill="#5B6F8E" text-anchor="start">選手各跑一段，棒子是產物檔案，裁判不下場</text>
<text x="40" y="530" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="700" fill="#1E63D1" text-anchor="start">選手不直接傳話，只傳棒；裁判只看棒子有沒有換</text>
<rect x="330" y="140" width="300" height="78" rx="14" fill="#FFD166"/>
<text x="480.0" y="177.0" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#14284B" text-anchor="middle">Orchestrator（裁判）</text>
<text x="480.0" y="201.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#14284B" text-anchor="middle" opacity="0.9">不產出，只調度</text>
<rect x="40" y="330" width="190" height="90" rx="14" fill="#1E63D1"/>
<text x="135.0" y="373.0" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#F8FAFF" text-anchor="middle">PRD agent</text>
<text x="135.0" y="397.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#F8FAFF" text-anchor="middle" opacity="0.9">寫需求</text>
<line x1="480" y1="218" x2="145.5" y2="326.6" stroke="#5B6F8E" stroke-width="2" stroke-dasharray="7 6"/>
<polygon points="135,330 143.6,320.9 147.3,332.3" fill="#5B6F8E"/>
<rect x="270" y="330" width="190" height="90" rx="14" fill="#1E63D1"/>
<text x="365.0" y="373.0" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#F8FAFF" text-anchor="middle">SA agent</text>
<text x="365.0" y="397.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#F8FAFF" text-anchor="middle" opacity="0.9">分析</text>
<line x1="480" y1="218" x2="372.9" y2="322.3" stroke="#5B6F8E" stroke-width="2" stroke-dasharray="7 6"/>
<polygon points="365,330 368.7,318.0 377.1,326.6" fill="#5B6F8E"/>
<rect x="500" y="330" width="190" height="90" rx="14" fill="#1E63D1"/>
<text x="595.0" y="373.0" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#F8FAFF" text-anchor="middle">SD agent</text>
<text x="595.0" y="397.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#F8FAFF" text-anchor="middle" opacity="0.9">設計</text>
<line x1="480" y1="218" x2="587.1" y2="322.3" stroke="#5B6F8E" stroke-width="2" stroke-dasharray="7 6"/>
<polygon points="595,330 582.9,326.6 591.3,318.0" fill="#5B6F8E"/>
<rect x="730" y="330" width="190" height="90" rx="14" fill="#1E63D1"/>
<text x="825.0" y="373.0" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#F8FAFF" text-anchor="middle">Dev agent</text>
<text x="825.0" y="397.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#F8FAFF" text-anchor="middle" opacity="0.9">實作</text>
<line x1="480" y1="218" x2="814.5" y2="326.6" stroke="#5B6F8E" stroke-width="2" stroke-dasharray="7 6"/>
<polygon points="825,330 812.7,332.3 816.4,320.9" fill="#5B6F8E"/>
<line x1="232" y1="375" x2="257.0" y2="375.0" stroke="#14284B" stroke-width="2.5"/>
<polygon points="268,375 257.0,381.0 257.0,369.0" fill="#14284B"/>
<rect x="220.0" y="338" width="60" height="22" rx="11" fill="#C7B8FF"/>
<text x="250.0" y="354" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700" fill="#14284B" text-anchor="middle">PRD.md</text>
<line x1="462" y1="375" x2="487.0" y2="375.0" stroke="#14284B" stroke-width="2.5"/>
<polygon points="498,375 487.0,381.0 487.0,369.0" fill="#14284B"/>
<rect x="450.0" y="338" width="60" height="22" rx="11" fill="#C7B8FF"/>
<text x="480.0" y="354" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700" fill="#14284B" text-anchor="middle">SA.md</text>
<line x1="692" y1="375" x2="717.0" y2="375.0" stroke="#14284B" stroke-width="2.5"/>
<polygon points="728,375 717.0,381.0 717.0,369.0" fill="#14284B"/>
<rect x="680.0" y="338" width="60" height="22" rx="11" fill="#C7B8FF"/>
<text x="710.0" y="354" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700" fill="#14284B" text-anchor="middle">SD.md</text>
<text x="480" y="462" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="400" fill="#5B6F8E" text-anchor="middle">每一棒只讀宣告的輸入、只寫自己的輸出</text>
<text x="480" y="486" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="400" fill="#5B6F8E" text-anchor="middle">虛線 = 裁判派工與收結果（不傳內容）</text>
</svg>
