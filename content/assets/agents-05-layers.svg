<text x="780.0" y="221.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#14284B" text-anchor="middle" opacity="0.9">對話問答 → Slack / 網頁通知</text>
