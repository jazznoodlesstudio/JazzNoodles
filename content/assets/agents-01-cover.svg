<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="第 01 篇封面：為什麼拆成專職 agent">
  <title>第 01 篇封面：為什麼拆成專職 agent</title>

  <defs>
    <linearGradient id="sky-agents-01-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E63D1"/><stop offset="1" stop-color="#6FB6FF"/>
    </linearGradient>
    <filter id="glow-agents-01-cover" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky-agents-01-cover)"/>
  <!-- 光帶：粗細不一、彼此穿梭，只放在右側與下緣，不壓到文字 -->
  <path d="M560 700 C 700 420, 860 640, 1000 360 S 1160 120, 1260 60" fill="none"
        stroke="#FFD166" stroke-width="14" stroke-linecap="round" opacity=".95"/>
  <path d="M520 -40 C 700 160, 760 60, 900 250 S 1100 420, 1260 330" fill="none"
        stroke="#F8FAFF" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <path d="M640 720 C 760 560, 920 700, 1040 520 S 1180 300, 1260 330" fill="none"
        stroke="#F8FAFF" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
  <!-- 交會處發光 -->
  <circle cx="905" cy="258" r="26" fill="#FFD166" opacity=".55" filter="url(#glow-agents-01-cover)"/>
  <circle cx="1002" cy="372" r="20" fill="#F8FAFF" opacity=".5" filter="url(#glow-agents-01-cover)"/>
  <!-- 切分音：間距不規則的光點 -->
  <g fill="#F8FAFF" opacity=".7">
    <circle cx="610" cy="70" r="3"/><circle cx="668" cy="46" r="2"/><circle cx="781" cy="84" r="4"/>
    <circle cx="830" cy="560" r="3"/><circle cx="1096" cy="590" r="2.5"/><circle cx="1150" cy="480" r="3.5"/>
  </g>
  <!-- 刻意偏離網格的重點色 -->
  <circle cx="1118" cy="148" r="11" fill="#C7B8FF"/>


  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#F8FAFF">
    <text x="72" y="96" font-size="22" font-weight="600" letter-spacing="3">TECHNOLOGY · AI AGENTS</text>
    <rect x="72" y="116" width="64" height="6" rx="3" fill="#FFD166"/>
    <text x="72" y="238" font-size="88" font-weight="800" opacity=".35">01</text>
    <text x="72" y="340" font-size="64" font-weight="800">為什麼拆成</text>
    <text x="72" y="418" font-size="64" font-weight="800">專職 agent</text>
    <text x="72" y="486" font-size="26" opacity=".92">每一棒都要有人能驗收</text>
    <text x="72" y="570" font-size="24" font-weight="700" letter-spacing="1">Jazznoodles</text>
  </g>

<g><rect x="700" y="330" width="64" height="130" rx="14" fill="#F8FAFF" opacity=".92"/><rect x="790" y="280" width="64" height="180" rx="14" fill="#F8FAFF" opacity=".92"/><rect x="880" y="360" width="64" height="100" rx="14" fill="#F8FAFF" opacity=".92"/><rect x="970" y="300" width="64" height="160" rx="14" fill="#F8FAFF" opacity=".92"/><rect x="1060" y="250" width="64" height="150" rx="14" fill="#C7B8FF"/><rect x="700" y="468" width="424" height="6" rx="3" fill="#F8FAFF" opacity=".5"/></g>
</svg>
