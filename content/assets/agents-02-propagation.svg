<text x="585.0" y="224.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#14284B" text-anchor="middle" opacity="0.9">STALE</text>
<line x1="682" y1="202" x2="702.0" y2="202.0" stroke="#14284B" stroke-width="2.5"/>
<polygon points="713,202 702.0,208.0 702.0,196.0" fill="#14284B"/>
