<text x="360.0" y="224.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#14284B" text-anchor="middle" opacity="0.9">指紋對不上 → STALE</text>
<line x1="457" y1="202" x2="477.0" y2="202.0" stroke="#14284B" stroke-width="2.5"/>
<polygon points="488,202 477.0,208.0 477.0,196.0" fill="#14284B"/>
<rect x="490" y="160" width="190" height="84" rx="14" fill="#6FB6FF"/>
