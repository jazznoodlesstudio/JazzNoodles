<text x="810.0" y="200.0" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#14284B" text-anchor="middle">Code</text>
<text x="810.0" y="224.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#14284B" text-anchor="middle" opacity="0.9">STALE</text>
<text x="480" y="282" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="400" fill="#5B6F8E" text-anchor="middle">依拓撲順序一個一個派工；文件類更新後仍要人工核准</text>
<rect x="40" y="330" width="400" height="100" rx="14" fill="#1E63D1"/>
<text x="240.0" y="378.0" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#F8FAFF" text-anchor="middle">sa-agent 評估影響</text>
<text x="240.0" y="402.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#F8FAFF" text-anchor="middle" opacity="0.9">附上游 diff＋「只改受影響章節」</text>
<rect x="500" y="330" width="420" height="100" rx="14" fill="#E3EEFF"/>
<text x="710.0" y="378.0" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#14284B" text-anchor="middle">有影響：列受影響章節 → 更新</text>
<text x="710.0" y="402.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#14284B" text-anchor="middle" opacity="0.9">SA v3→v4 → 人工核准 → 往下傳</text>
