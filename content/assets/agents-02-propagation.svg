<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="上游一變，下游自動標成過期。指紋對不上就是 STALE；下游可以回報 NO_CHANGE">
<title>上游一變，下游自動標成過期</title>
<rect width="960" height="560" rx="20" fill="#F8FAFF" stroke="#6FB6FF" stroke-width="2"/>
<rect x="40" y="40" width="10" height="34" rx="3" fill="#FFD166"/>
<text x="64" y="68" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="800" fill="#14284B" text-anchor="start">上游一變，下游自動標成過期</text>
<text x="40" y="106" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="400" fill="#5B6F8E" text-anchor="start">指紋對不上就是 STALE；下游可以回報 NO_CHANGE</text>
<text x="40" y="530" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="700" fill="#1E63D1" text-anchor="start">過期不等於重寫：先評估影響，再只改受影響章節</text>
<rect x="40" y="160" width="190" height="84" rx="14" fill="#FFD166"/>
<text x="135.0" y="200.0" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#14284B" text-anchor="middle">PRD v2→v3</text>
<text x="135.0" y="224.0" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" font-weight="400" fill="#14284B" text-anchor="middle" opacity="0.9">新增 FR-07</text>
