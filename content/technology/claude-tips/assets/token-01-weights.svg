</defs><rect x="0" y="0" width="900" height="440" rx="16" fill="#FBFAF7" stroke="#E3E0D8" stroke-width="1.5" /><text x="36" y="52" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="26" font-weight="800" fill="#1F2A3A" text-anchor="start" >不同的 token，價格不同</text><text x="36" y="84" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="400" fill="#6B7686" text-anchor="start" >以一般輸入 = 1 為基準（API 計價比例）</text><text x="204" y="155" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="18" font-weight="600" fill="#1F2A3A" text-anchor="end" >快取讀取</text><rect x="220" y="130" width="11.8" height="36" rx="6" fill="#2E9E6B"  /><text x="243.8" y="155" font-family="&apos;JetBrains Mono&apos;,&apos;SFMono-Regular&apos;,Menlo,Consolas,monospace" font-size="20" font-weight="800" fill="#1F2A3A" text-anchor="start" >0.1</text><text x="301.8" y="155" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="15" font-weight="400" fill="#6B7686" text-anchor="start" >前綴沒變、5 分鐘內</text><text x="204" y="213" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="18" font-weight="600" fill="#1F2A3A" text-anchor="end" >一般輸入</text><rect x="220" y="188" width="118" height="36" rx="6" fill="#9AA5B4"  /><text x="350" y="213" font-family="&apos;JetBrains Mono&apos;,&apos;SFMono-Regular&apos;,Menlo,Consolas,monospace" font-size="20" font-weight="800" fill="#1F2A3A" text-anchor="start" >1</text><text x="408" y="213" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-