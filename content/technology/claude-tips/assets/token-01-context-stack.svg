ill="#1F2A3A" text-anchor="middle" >30</text><line x1="90" y1="450" x2="900" y2="450" stroke="#6B7686" stroke-width="1.5" /><rect x="110" y="111" width="18" height="18" rx="4" fill="#5B8DEF"  /><text x="136" y="125" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="16" font-weight="500" fill="#6B7686" text-anchor="start" >固定前綴（系統指令、工具、記憶）</text><rect x="406" y="111" width="18" height="18" rx="4" fill="#FCE9C8"  /><text x="432" y="125" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="16" font-weight="500" fill="#6B7686" text-anchor="start" >累積的歷史與工具結果</text><rect x="606" y="111" width="18" height="18" rx="4" fill="#F2A541"  /><text x="632" y="125" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="16" font-weight="500" fill="#6B7686" text-anchor="start" >這一輪新增</text><rect x="110" y="160" width="300" height="66" rx="10" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1" /><text x="126" y="188" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="700" fill="#1F2A3A" text-anchor="start" >讀檔、搜尋、呼叫 MCP</text><text x="126" y="212" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="16" font-weight="500" fill="#6B7686" text-anchor="start" >每一次工具呼叫也算一輪</text><text x="480.0" y="515" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="18" font-weight="600" fill="#1F2A3A" text-anchor="middle" >N 輪總量 ≈ N·F ＋ k·N²/2　→　對話長度加倍，歷史部分約變 4 倍</text></svg>
