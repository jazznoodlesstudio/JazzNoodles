</defs><rect x="0" y="0" width="960" height="470" rx="16" fill="#FBFAF7" stroke="#E3E0D8" stroke-width="1.5" /><text x="36" y="52" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="26" font-weight="800" fill="#1F2A3A" text-anchor="start" >同樣五個修改，三種做法</text><text x="36" y="84" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="400" fill="#6B7686" text-anchor="start" >每一輪都要背著前面所有截圖與整頁 HTML</text><rect x="50" y="105" width="270" height="330" rx="14" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1.5" /><text x="185" y="145" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="20" font-weight="800" fill="#1F2A3A" text-anchor="middle" >分 5 則傳</text><text x="185" y="205" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="44" font-weight="800" fill="#D9534F" text-anchor="middle" >5 輪</text><rect x="79" y="378" width="36" height="22" rx="4" fill="#D9534F"  opacity="0.45"/><rect x="123" y="360" width="36" height="40" rx="4" fill="#D9534F"  opacity="0.56"/><rect x="167" y="342" width="36" height="58" rx="4" fill="#D9534F"  opacity="0.67"/><rect x="211" y="324" width="36" height="76" rx="4" fill="#D9534F"  opacity="0.78"/><rect x="255" y="306" width="36" height="94" rx="4" fill="#D9534F"  opacity="0.89"/><text x="185" y="425" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="15" font-weight="500" fill="#6B7686" text-anchor="middle" >每輪越來越貴</text><rect x="350" y="105" width="270" height="330" rx="14" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1.5" /><text x="485" y="145" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="20" font-weight="800" fill="#1F2A3A" text-anchor="middle" >集中成 1 則</text><text x="485" y="205" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="44" font-weight="800" fill="#5B8DEF" text-anchor="middle" >1 輪</text><rect x="467" y="378" width="36" height="22" rx="4" fill="#5B8DEF"  opacity="0.45"/><text x="485" y="425" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="15" font-weight="500" fill="#6B7686" text-anchor="middle" >只付一次</text><rect x="650" y="105" width="270" height="330" rx="14" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1.5" /><text x="785" y="145" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="20" font-weight="800" fill="#1F2A3A" text-anchor="middle" >CONFIG＋調整面板</text><text x="785" y="205" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="44" font-weight="800" fill="#2E9E6B" text-anchor="middle" >0 輪</text><rect x="690" y="260" width="190" height="10" rx="5" fill="#E6E2D9"  /><rect x="690" y="260" width="120" height="10" rx="5" fill="#2E9E6B"  /><circle cx="810" cy="265" r="12" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="3"/><rect x="690" y="305" width="190" height="10" rx="5" fill="#E6E2D9"  /><rect x="690" y="305" width="70" height="10" rx="5" fill="#2E9E6B"  /><circle cx="760" cy="310" r="12" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="3"/><text x="785" y="375" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="16" font-weight="600" fill="#1F2A3A" text-anchor="middle" >在瀏覽器裡自己調</text><text x="785" y="425" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="15" font-weight="500" fill="#6B7686" text-anchor="middle" >0 輸出，試幾次都免費</text></svg>
