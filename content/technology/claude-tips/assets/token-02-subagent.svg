<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="subagent 隔離雜訊示意"><title>subagent 隔離雜訊示意</title><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6B7686"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#F2A541"/></marker>
</defs><rect x="0" y="0" width="960" height="470" rx="16" fill="#FBFAF7" stroke="#E3E0D8" stroke-width="1.5" /><text x="36" y="52" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="26" font-weight="800" fill="#1F2A3A" text-anchor="start" >雜訊工作交給 subagent</text><text x="36" y="84" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="400" fill="#6B7686" text-anchor="start" >過程很吵、結論很短的工作，讓過程留在另一個 context</text><rect x="40" y="110" width="400" height="270" rx="14" fill="#FFFFFF" stroke="#5B8DEF" stroke-width="2" /><text x="60" y="145" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="20" font-weight="800" fill="#1F2A3A" text-anchor="start" >主對話 context</text><rect x="60" y="165" width="360" height="38" rx="8" fill="#DCE6FA"  /><text x="76" y="190" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="600" fill="#1F2A3A" text-anchor="start" >系統指令＋CLAUDE.md</text><rect x="60" y="215" width="360" height="38" rx="8" fill="#DCE6FA"  /><text x="76" y="240" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="600" fill="#1F2A3A" text-anchor="start" >你的問題與計畫</text><rect x="60" y="265" width="360" height="38" rx="8" fill="#F2A541"  /><text x="76" y="290" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="600" fill="#0F1B2D" text-anchor="start" >subagent 回報：3 行摘要</text><rect x="60" y="315" width="360" height="38" rx="8" fill="#DCE6FA"  /><text x="76" y="340" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="600" fill="#1F2A3A" text-anchor="start" >下一步：切 Sonnet 實作</text><rect x="560" y="110" width="360" height="270" rx="14" fill="#F3F1EC" stroke="#6B7686" stroke-width="2" stroke-dasharray="8 6"/><text x="580" y="145" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="20" font-weight="800" fill="#1F2A3A" text-anchor="start" >subagent 獨立 context（Haiku）</text><rect x="580" y="170" width="320" height="48" rx="8" fill="#E6E2D9"  /><text x="596" y="200" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="600" fill="#6B7686" text-anchor="start" >測試輸出 1,800 行</text><rect x="580" y="232" width="320" height="48" rx="8" fill="#E6E2D9"  /><text x="596" y="262" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="600" fill="#6B7686" text-anchor="start" >翻 log</text><rect x="580" y="294" width="320" height="48" rx="8" fill="#E6E2D9"  /><text x="596" y="324" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="600" fill="#6B7686" text-anchor="start" >查文件</text><text x="740" y="362" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="15" font-weight="500" fill="#6B7686" text-anchor="middle" >用完即丟，不進主對話</text><line x1="442" y1="165" x2="556" y2="165" stroke="#6B7686" stroke-width="2.5" marker-end="url(#arr)" /><text x="499" y="155" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="15" font-weight="600" fill="#6B7686" text-anchor="middle" >派工</text><line x1="558" y1="280" x2="424" y2="280" stroke="#F2A541" stroke-width="3" marker-end="url(#arrA)" /><text x="492" y="268" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="15" font-weight="700" fill="#B9741A" text-anchor="middle" >只回摘要</text><text x="40" y="420" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="700" fill="#D9534F" text-anchor="start" >直接在主對話跑：1,800 行 × 之後每一輪</text><text x="40" y="448" font-family="&apos;Noto Sans TC&apos;,&apos;PingFang TC&apos;,&apos;Microsoft JhengHei&apos;,&apos;Noto Sans CJK TC&apos;,sans-serif" font-size="17" font-weight="700" fill="#2E9E6B" text-anchor="start" >交給 subagent：3 行 × 之後每一輪</text></svg>
