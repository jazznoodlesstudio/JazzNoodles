<text x="64" y="308" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="28" font-weight="900" fill="#102B50" text-anchor="start">project</text>
<text x="240" y="306" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#102B50" text-anchor="start">全組共用｜進版控</text>
<text x="240" y="336" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="17" font-weight="400" fill="#102B50" text-anchor="start" opacity="0.9">.mcp.json（專案根目錄）</text>
<text x="896" y="320" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="700" fill="#102B50" text-anchor="end">優先 2</text>
