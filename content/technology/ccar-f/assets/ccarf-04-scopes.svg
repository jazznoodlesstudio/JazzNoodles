<text x="240" y="406" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#102B50" text-anchor="start">只有你｜所有專案</text>
<text x="240" y="436" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="17" font-weight="400" fill="#102B50" text-anchor="start" opacity="0.9">~/.claude.json（最上層）</text>
<text x="896" y="420" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="700" fill="#102B50" text-anchor="end">優先 3</text>
