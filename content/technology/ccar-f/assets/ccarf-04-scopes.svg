<rect x="40" y="70" width="10" height="34" fill="#D6A45B"/>
<text x="64" y="98" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="900" fill="#102B50" text-anchor="start">MCP 設定範圍：誰看得到、誰優先</text>
<text x="40" y="136" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="400" fill="#51647D" text-anchor="start">同名時取最高優先的整份定義，欄位不合併</text>
<rect x="40" y="170" width="880" height="84" rx="4" fill="#102B50"/>
<text x="64" y="208" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="28" font-weight="900" fill="#F4F1E9" text-anchor="start">local</text>
<text x="240" y="206" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#F4F1E9" text-anchor="start">預設｜只有你、只有這個專案</text>
<text x="240" y="236" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="17" font-weight="400" fill="#F4F1E9" text-anchor="start" opacity="0.9">~/.claude.json（專案路徑下）</text>
<text x="896" y="220" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="700" fill="#F4F1E9" text-anchor="end">優先 1</text>
