<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="MCP 設定範圍：誰看得到、誰優先。同名時取最高優先的整份定義，欄位不合併">
<title>MCP 設定範圍：誰看得到、誰優先</title>
<rect width="960" height="470" fill="#F4F1E9"/>
<line x1="40" y1="26" x2="920" y2="26" stroke="#102B50" stroke-width="1" opacity="0.14"/>
<line x1="40" y1="32" x2="920" y2="32" stroke="#102B50" stroke-width="1" opacity="0.14"/>
