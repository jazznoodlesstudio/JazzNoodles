<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="五個 domain 的權重。Domain 1 最重，占將近三成；Domain 5 雖然最少，卻會滲進其他情境題">
<title>五個 domain 的權重</title>
<rect width="960" height="560" fill="#F4F1E9"/>
<line x1="40" y1="26" x2="920" y2="26" stroke="#102B50" stroke-width="1" opacity="0.14"/>
<line x1="40" y1="32" x2="920" y2="32" stroke="#102B50" stroke-width="1" opacity="0.14"/>
<line x1="40" y1="38" x2="920" y2="38" stroke="#102B50" stroke-width="1" opacity="0.14"/>
<line x1="40" y1="44" x2="920" y2="44" stroke="#102B50" stroke-width="1" opacity="0.14"/>
<line x1="40" y1="50" x2="920" y2="50" stroke="#102B50" stroke-width="1" opacity="0.14"/>
<rect x="40" y="70" width="10" height="34" fill="#D6A45B"/>
<text x="64" y="98" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="900" fill="#102B50" text-anchor="start">五個 domain 的權重</text>
<text x="40" y="136" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="400" fill="#51647D" text-anchor="start">Domain 1 最重，占將近三成；Domain 5 雖然最少，卻會滲進其他情境題</text>
<text x="40" y="220" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#102B50" text-anchor="start">1  Agentic 架構與編排</text>
<rect x="340" y="196" width="432" height="36" rx="3" fill="#D6A45B"/>
<text x="786" y="223" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="24" font-weight="900" fill="#102B50" text-anchor="start">27%</text>
<text x="40" y="286" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#102B50" text-anchor="start">3  Claude Code 設定與流程</text>
<rect x="340" y="262" width="320" height="36" rx="3" fill="#102B50"/>
<text x="674" y="289" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="24" font-weight="900" fill="#102B50" text-anchor="start">20%</text>
<text x="40" y="352" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#102B50" text-anchor="start">4  Prompt 與結構化輸出</text>
<rect x="340" y="328" width="320" height="36" rx="3" fill="#102B50"/>
<text x="674" y="355" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="24" font-weight="900" fill="#102B50" text-anchor="start">20%</text>
<text x="40" y="418" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#102B50" text-anchor="start">2  工具設計與 MCP</text>
<rect x="340" y="394" width="288" height="36" rx="3" fill="#8BAAC8"/>
<text x="642" y="421" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="24" font-weight="900" fill="#102B50" text-anchor="start">18%</text>
<text x="40" y="484" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#102B50" text-anchor="start">5  Context 管理與可靠性</text>
<rect x="340" y="460" width="240" height="36" rx="3" fill="#3E5C85"/>
<text x="594" y="487" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="24" font-weight="900" fill="#102B50" text-anchor="start">15%</text>
<text x="40" y="532" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" font-weight="400" fill="#51647D" text-anchor="start">權重引自第三方整理的 exam guide 數字，以官方為準；60 題、六個情境抽四個</text>
</svg>
